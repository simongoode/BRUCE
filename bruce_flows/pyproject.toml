[project]
name = "bruce_flows"
version = "0.1.0"
description = "bruce-flows using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]==1.2.1",
]

[project.scripts]
kickoff = "bruce_flows.main:kickoff"
run_crew = "bruce_flows.main:kickoff"
plot = "bruce_flows.main:plot"
run_with_trigger = "bruce_flows.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
