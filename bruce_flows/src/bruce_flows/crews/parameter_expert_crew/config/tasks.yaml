analyze_mass_posteriors:
  description: >
    Read the PE report at {pe_report_path} and analyze mass parameters (M_c, q, m_1, m_2, chi_eff, eta).
    {previous_analyses}
    Write a concise 2-3 sentence analysis summarizing key characteristics, trends, and 90% credible intervals.
    Compare with previous rounds if available. Save your analysis to {analysis_file_path} using write_file.
  expected_output: >
    A 2-3 sentence professional analysis saved to {analysis_file_path}.
  agent: mass_expert

analyze_distance_posteriors:
  description: >
    Read the PE report at {pe_report_path} and analyze distance parameters (d_L, iota).
    {previous_analyses}
    Write a concise 2-3 sentence analysis summarizing key characteristics, trends, and 90% credible intervals.
    Compare with previous rounds if available. Save your analysis to {analysis_file_path} using write_file.
  expected_output: >
    A 2-3 sentence professional analysis saved to {analysis_file_path}.
  agent: distance_expert
